<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box&amp;Cox</title>
  <meta name="description" content="복스앤콕스 — Space Communication을 전문으로 하는 환경디자인 기업. 전시, 환경, 사인시스템 디자인." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Host+Grotesk:wght@300..800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260925f" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="logo" id="logoHome" aria-label="Box&amp;Cox 홈으로">
        <img src="assets/logo.png" alt="Box&amp;Cox" class="logo-mark" />
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="#work-scope">Work Scope</a>
        <a href="#work-process">Work Process</a>
        <a href="#projects">Projects</a>
        <a href="contact.html" class="site-nav-contact">Contact Us</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- 1. Hero -->
    <section id="prologue" class="hero">
      <video
        class="hero-video"
        id="heroVideo"
        autoplay
        muted
        playsinline
        poster="assets/hero-poster.jpg"
        src="assets/hero-video-00.mp4"
      ></video>
      <div class="grain-layer">
        <canvas class="grain-canvas" aria-hidden="true"></canvas>
        <div class="grain-wave"></div>
      </div>
      <div class="container hero-inner">
        <span class="hero-pill reveal" id="heroEyebrow"></span>
        <h1 class="hero-heading reveal" id="heroHeading"></h1>
        <p class="hero-sub reveal" id="heroSub"></p>
        <a href="#projects" class="hero-cta reveal" id="heroCta"></a>
      </div>
      <div class="hero-logo-mark reveal" id="heroLogoMark" aria-hidden="true">
        <div class="hero-slide hero-slide-current" id="heroSlideCurrent">
          <img class="hero-slide-logo-img" src="assets/logo.png" alt="" />
          <span class="hero-logo-sweep"></span>
        </div>
        <div class="hero-slide hero-slide-next" id="heroSlideNext"></div>
      </div>
    </section>

    <!-- 1b. Prologue detail -->
    <section class="prologue">
      <div class="container prologue-inner">
        <p class="eyebrow reveal">PROLOGUE</p>
        <h2 class="section-heading-en reveal">Our philosophy</h2>
        <p class="section-heading-ko reveal">기업 철학 및 소개</p>
        <div class="prologue-slider reveal" id="prologueSlider" aria-label="주요 프로젝트 사진">
          <div class="prologue-slider-track" id="prologueSlides"></div>
          <div class="prologue-slider-dots" id="prologueDots" role="tablist"></div>
        </div>
        <div class="prologue-copy">
          <h3 class="prologue-tagline reveal" id="prologueTagline"></h3>
          <p class="prologue-body reveal" id="prologueBody"></p>
        </div>
      </div>
    </section>

    <!-- 1c. Projects (moved up from the bottom) -->
    <section id="projects" class="projects">
      <!-- Full-bleed corridor: two rails of project photos riding out of the
           vanishing point, with the section head sitting over them. -->
      <div class="works-stream" id="worksStream">
        <!-- The one light band on the page; the corridor rides over it. -->
        <div class="section-aurora" aria-hidden="true">
          <span class="aurora-blob aurora-blob-1"></span>
          <span class="aurora-blob aurora-blob-2"></span>
          <span class="aurora-blob aurora-blob-3"></span>
          <span class="aurora-blob aurora-blob-4"></span>
          <span class="aurora-grain"></span>
        </div>
        <div class="works-stream-stage" aria-hidden="true">
          <div class="works-stream-rails" id="worksStreamRails"></div>
        </div>
        <div class="works-stream-content">
          <div class="works-stream-head">
            <p class="eyebrow reveal">PROJECTS</p>
            <h2 class="section-heading-en reveal">Selected works</h2>
          </div>
          <p class="works-stream-note reveal">
            주요 프로젝트 레퍼런스<br />
            30여년간 쌓아온 공간, 지금부터 하나씩 펼쳐집니다.
          </p>
        </div>
      </div>
      <div class="container">
        <div id="projectList" class="project-list"></div>
        <div id="projectRows" class="project-rows"></div>
      </div>
    </section>

    <!-- 1d. Punch statement -->
    <section class="punch-band">
      <p class="punch-text-en reveal" id="punchTextEn"></p>
      <p class="punch-text-ko reveal" id="punchTextKo"></p>
    </section>

    <!-- 2. Work Scope -->
    <section id="work-scope" class="work-scope">
      <div class="container">
        <div class="section-head section-head--split">
          <div>
            <p class="eyebrow reveal">WORK SCOPE</p>
            <h2 class="section-heading-en reveal">Scope of work</h2>
            <p class="section-heading-ko reveal">사업 영역</p>
          </div>
          <p id="workScopeIntro" class="section-intro reveal"></p>
        </div>
        <div class="media-frame reveal" data-reference="GENESIS HOUSE">
          <img class="media-photo" src="assets/projects/genesis-house-space.jpg" alt="제네시스하우스 공간 디자인" loading="lazy" />
          <span class="media-curtain" aria-hidden="true"></span>
          <span class="media-label">제네시스하우스</span>
        </div>
        <div id="workScopeList" class="scope-list"></div>
      </div>
    </section>

    <!-- 3. Work Process -->
    <section id="work-process" class="work-process work-process--hero">
      <div class="container">
        <div class="section-head section-head--split">
          <div>
            <p class="eyebrow reveal">WORK PROCESS</p>
            <h2 class="section-heading-en reveal">How we work</h2>
            <p class="section-heading-ko reveal">업무 프로세스</p>
          </div>
          <p id="workProcessIntro" class="section-intro reveal"></p>
        </div>
        <p class="process-label reveal" id="processLabel"></p>
        <ol id="processSteps" class="process-steps"></ol>
      </div>
    </section>

    <!-- 5. Closing CTA -->
    <section class="cta-band">
      <div class="grain-layer">
        <canvas class="grain-canvas" aria-hidden="true"></canvas>
        <div class="grain-wave"></div>
      </div>
      <div class="container cta-band-inner">
        <p class="eyebrow reveal">CONTACT</p>
        <h2 class="section-heading-en reveal" id="ctaHeadingEn"></h2>
        <p class="section-heading-ko reveal" id="ctaHeadingKo"></p>
        <a href="#projects" class="hero-cta reveal" id="ctaCta"></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; 2026 Box&amp;Cox. All rights reserved.</span>
      <div class="footer-links">
        <a href="#top">위로</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js?v=20260925f"></script>
  <script src="js/main.js?v=20260925f"></script>
</body>
</html>
