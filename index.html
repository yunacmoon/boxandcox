<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box&amp;Cox</title>
  <meta name="description" content="복스앤콕스 — Space Communication을 전문으로 하는 환경디자인 기업. 전시, 환경, 사인시스템 디자인." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="logo">Box<span class="logo-accent">&amp;</span>Cox</a>
      <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="#prologue">Prologue</a>
        <a href="#work-scope">Work Scope</a>
        <a href="#work-process">Work Process</a>
        <a href="#projects">Projects</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- 1. Prologue -->
    <section id="prologue" class="prologue">
      <div class="container prologue-inner">
        <p class="eyebrow reveal">PROLOGUE</p>
        <h1 class="reveal">기업 철학 및 소개</h1>
        <div class="media-frame reveal" data-reference="BOX&amp;COX_CRD_018.jpg">
          <span class="media-label">BOX&amp;COX_CRD_018.jpg</span>
        </div>
        <div id="prologueBlocks" class="prologue-blocks"></div>
      </div>
    </section>

    <!-- 2. Work Scope -->
    <section id="work-scope" class="work-scope">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">WORK SCOPE</p>
          <h2>사업 영역</h2>
          <p id="workScopeIntro" class="section-intro"></p>
        </div>
        <div class="media-frame reveal" data-reference="BOX&amp;COX_CRD_014.jpg">
          <span class="media-label">BOX&amp;COX_CRD_014.jpg</span>
        </div>
        <div id="workScopeList" class="scope-list"></div>
      </div>
    </section>

    <!-- 3. Work Process -->
    <section id="work-process" class="work-process">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">WORK PROCESS</p>
          <h2>업무 프로세스</h2>
          <p id="workProcessIntro" class="section-intro"></p>
        </div>
        <div class="media-frame reveal" data-reference="BOX&amp;COX_CRD_013.jpg">
          <span class="media-label">BOX&amp;COX_CRD_013.jpg</span>
        </div>
        <p class="process-label reveal" id="processLabel"></p>
        <ol id="processSteps" class="process-steps"></ol>
      </div>
    </section>

    <!-- 4. Projects -->
    <section id="projects" class="projects">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">PROJECTS</p>
          <h2>주요 프로젝트 레퍼런스</h2>
        </div>
        <div id="projectList" class="project-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; 2026 Box&amp;Cox. All rights reserved.</span>
      <div class="footer-links">
        <a href="#top">위로</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
